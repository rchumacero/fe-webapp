<svg viewBox="0 0 600 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- Icon: minimalist speech-mark / bag hybrid suggesting "yours" + commerce -->
  <g transform="translate(60,50)">
    <rect x="0" y="20" width="120" height="100" rx="18" fill="url(#bgGrad)"/>
    <!-- handle forming a subtle heart/tag curve to suggest personalization -->
    <path d="M28 20 Q28 -12 60 -12 Q92 -12 92 20"
          fill="none" stroke="#1E3A8A" stroke-width="10" stroke-linecap="round"/>
    <!-- minimalist checkmark / tick inside, representing "it's yours, confirmed" -->
    <path d="M35 70 L55 90 L90 50"
          fill="none" stroke="#FFFFFF" stroke-width="10"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark -->
  <text x="210" y="115" font-family="Helvetica, Arial, sans-serif" font-weight="700"
        font-size="56" fill="#1E3A8A" letter-spacing="1">Lo</text>
  <text x="210" y="170" font-family="Helvetica, Arial, sans-serif" font-weight="700"
        font-size="56" fill="#3B82F6" letter-spacing="1">Tuyo</text>
</svg>
